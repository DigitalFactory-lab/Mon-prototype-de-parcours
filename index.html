<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon prototype de parcours — Opération Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Digital Factory : Poppins, ardoise, bleu-violet et mauve. */
  --ink:#2f3a48;
  --ink-soft:#465260;
  --ink-muted:#626c7a;
  --paper:#f6f7fb;
  --paper-raised:#ffffff;
  --line:#dce0e9;
  --line-soft:#edf0f5;
  --brand-blue:#5b60a8;
  --brand-blue-dark:#484d8d;
  --brand-blue-light:#eef0fa;
  --brand-blue-mid:#dfe1f4;
  --brand-purple:#8c4292;
  --brand-purple-light:#f4eaf5;
  --teal:#267454;
  --coral:#b13c39;
  /* Échelle de réponse : du neutre vers le bleu, le mauve pour le maximum. */
  --scale-1:#b4bac6;
  --scale-2:#a7abd8;
  --scale-3:#5b60a8;
  --scale-4:#8c4292;
  /* Grille et finitions */
  --r-control:8px;
  --r-card:12px;
  --r-plate:16px;
  --ease:cubic-bezier(.2,0,0,1);
  --fast:150ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Poppins', sans-serif;
  font-size:14px;
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  font-variant-numeric:tabular-nums;
}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .radio-opt:focus-within{
  outline:2px solid var(--brand-blue); outline-offset:2px;
}
.app{max-width:980px; margin:0 auto; padding:0 24px 32px;}

/* ---------- En-tête : plaque d'atelier ---------- */
.plate{
  background:var(--ink);
  color:#ffffff;
  padding:32px;
  margin:32px 0 0;
  border-radius:var(--r-plate);
}
.plate-eyebrow{font-size:12px; font-weight:500; color:#c9cde0; margin-bottom:8px;}
.plate-title{font-weight:600; font-size:clamp(24px, 3.6vw, 32px); line-height:1.25; letter-spacing:-0.01em;}
.plate-sub{font-size:14px; color:#dfe3ec; margin-top:8px;}

/* ---------- Identité ---------- */
.identity{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  margin-top:16px;
  padding:20px 24px;
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:16px 24px;
}
.field label{display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-bottom:4px;}
.field input, .field select{
  width:100%; min-width:0; border:none; border-bottom:1px solid var(--line);
  background:transparent; font-size:15px; padding:8px 0; color:var(--ink);
  transition:border-color var(--fast) var(--ease);
}
.field input:focus, .field select:focus{outline:none; border-bottom-color:var(--brand-blue);}
.field input::placeholder{color:var(--ink-muted);}

/* ---------- Progression : une règle graduée, un repère par point abordé ---------- */
.progress{margin-top:24px;}
.progress-strip{
  --step:10%;
  position:relative; height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden;
}
.progress-fill{height:100%; background:var(--brand-blue); transition:width 300ms var(--ease);}
.progress-strip::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to right, transparent 0 calc(var(--step) - 2px), var(--paper) calc(var(--step) - 2px) var(--step));
}
.progress-label{font-size:12px; color:var(--ink-muted); text-align:right; margin-top:8px;}

/* ---------- Onglets ---------- */
.modebar{display:flex; gap:8px; margin:16px 0 24px;}
.modebar button{
  flex:1; min-height:48px; padding:12px 16px;
  border:1px solid var(--line); background:var(--paper-raised);
  font-weight:500; font-size:13px; color:var(--ink-soft);
  border-radius:var(--r-control); cursor:pointer;
  transition:background-color var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.modebar button.active{background:var(--brand-blue); color:#ffffff; border-color:var(--brand-blue);}
.modebar button:not(.active):hover{border-color:var(--brand-blue); color:var(--brand-blue-dark);}

.section{display:none;}
.section.active{display:block;}

/* ---------- Titres communs ---------- */
.section-intro{margin:0 0 4px;}
.section-intro + .section-intro, .axe-card + .section-intro{margin-top:40px;}
.section-intro-title, .synth-card h3, .decision-box h3, .section-heading{
  font-size:18px; font-weight:600; color:var(--ink); line-height:1.4;
}
.section-intro-sub{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
.section-heading{margin:32px 0 12px;}
.subsection-heading{font-size:14px; font-weight:500; color:var(--ink); line-height:1.5; margin-bottom:8px;}

/* ---------- Légende ---------- */
.legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin:16px 0; font-size:12px; color:var(--ink-soft);}
.legend span{display:inline-flex; align-items:center; gap:8px;}
.legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

/* ---------- Carte d'activité ---------- */
.axe-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  margin:16px 0;
  overflow:hidden;
}
.axe-head{
  display:flex; align-items:center; gap:12px;
  padding:16px 20px;
  background:var(--brand-blue-light);
  border-bottom:1px solid var(--line);
}
.axe-icon{
  width:36px; height:36px; padding:8px; border-radius:var(--r-control); flex-shrink:0;
  background:var(--paper-raised); color:var(--brand-blue);
  display:flex; align-items:center; justify-content:center;
}
.axe-icon svg{width:100%; height:100%;}
.axe-meta{flex:1; min-width:0;}
.axe-label{font-weight:600; font-size:16px; line-height:1.4;}
.vu-toggle{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:500;
  color:var(--ink-soft); cursor:pointer; user-select:none; white-space:nowrap;
}
.vu-toggle input{accent-color:var(--brand-blue); width:16px; height:16px; cursor:pointer;}
.axe-card.axe-notvu{opacity:0.64;}
.axe-card.axe-notvu .axe-head{background:var(--paper);}
.axe-card.axe-notvu .axe-label{color:var(--ink-muted);}
.axe-notvu-msg{padding:12px 20px 20px; font-size:13px; color:var(--ink-muted);}
.axe-desc{font-size:13px; color:var(--ink-soft); padding:16px 20px 0; line-height:1.6;}
.axe-body{padding:8px 20px 20px;}

.item-row{display:flex; flex-direction:column; gap:8px; padding:16px 0; border-top:1px solid var(--line-soft);}
.item-row:first-child{border-top:none;}
.item-text{font-size:14px; color:var(--ink);}
.item-text strong{font-weight:500;}
.item-hint{display:block; color:var(--ink-soft); font-size:13px;}

/* ---------- Échelle de réponse ---------- */
.gauge{display:flex; gap:8px;}
.gauge button{
  flex:1; min-height:40px; padding:8px 4px;
  border:1px solid var(--line); background:var(--paper);
  font-size:12px; font-weight:500; color:var(--ink-soft);
  border-radius:var(--r-control); cursor:pointer; text-align:center;
  transition:background-color var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.gauge button:hover{border-color:var(--brand-blue);}
.gauge button:active{transform:scale(.98);}
.gauge button.sel-1{background:var(--line-soft); color:var(--ink); border-color:var(--scale-1);}
.gauge button.sel-2{background:var(--brand-blue-light); color:var(--brand-blue-dark); border-color:var(--scale-2);}
.gauge button.sel-3{background:var(--brand-blue); color:#ffffff; border-color:var(--brand-blue);}
.gauge button.sel-4{background:var(--brand-purple); color:#ffffff; border-color:var(--brand-purple);}

.axe-note{margin-top:16px;}
.axe-note-label{display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-bottom:8px;}
.axe-note textarea, textarea.free{
  width:100%; border:1px solid var(--line); border-radius:var(--r-control);
  padding:12px; font-size:13px; resize:vertical; min-height:48px; background:#ffffff;
  transition:border-color var(--fast) var(--ease);
}
textarea.free{font-size:14px; min-height:88px; margin-top:12px;}
.axe-note textarea:focus, textarea.free:focus{outline:none; border-color:var(--brand-blue);}
textarea::placeholder{color:var(--ink-muted);}

/* ---------- Synthèse ---------- */
.synth-grid{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:16px; margin:0 0 16px;}
.synth-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-card); padding:20px 24px;}
.synth-card + .synth-card{margin-top:16px;}
.synth-grid .synth-card + .synth-card{margin-top:0;}
.synth-card h3{margin-bottom:16px;}
.bar-row{display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin:12px 0;}
.bar-label{width:100%; font-size:12px; color:var(--ink);}
.bar-track{flex:1; min-width:40px; height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; border-radius:4px; transition:width 300ms var(--ease);}
.bar-word{font-size:12px; font-weight:500; width:104px; text-align:right; flex-shrink:0;}
.radar-wrap{display:flex; justify-content:center; padding:8px 0;}
.radar-wrap svg{max-width:100%; height:auto;}
.strengths{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:8px;}
.strength-row{font-size:13px; padding:8px 0; border-top:1px solid var(--line-soft);}
.empty-note{font-size:13px; color:var(--ink-muted);}

/* ---------- Pistes ---------- */
.rank-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
.rank-item{
  display:flex; align-items:flex-start; gap:16px;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-card);
  padding:16px 20px;
}
.rank-pos{font-size:16px; font-weight:500; color:var(--ink-muted); width:24px; flex-shrink:0; line-height:1.4;}
.rank-main{flex:1; min-width:0;}
.rank-title{font-weight:500; font-size:14px;}
.rank-sub{font-size:12px; color:var(--ink-muted); margin-top:4px;}
.rank-note{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
.rank-tag{
  display:inline-flex; align-items:center; gap:8px; margin-top:8px;
  font-size:12px; font-weight:500; color:var(--teal);
}
.rank-tag::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
.rank-pistelabel{font-weight:500; font-size:12px; width:112px; text-align:right; flex-shrink:0; line-height:1.9;}
.footnote{font-size:12px; color:var(--ink-muted); margin-top:12px; line-height:1.6;}

/* ---------- Suite de parcours ---------- */
.decision-box{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--r-card); padding:20px 24px; margin:0 0 16px;}
.decision-box h3{margin-bottom:4px;}
.decision-hint{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}
.radio-row{display:flex; flex-direction:column; gap:8px;}
.radio-opt{
  display:flex; align-items:center; gap:12px; padding:12px 16px;
  border:1px solid var(--line); border-radius:var(--r-control); cursor:pointer; font-size:14px;
  transition:background-color var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.radio-opt:hover{border-color:var(--brand-blue);}
.radio-opt input{accent-color:var(--brand-blue); width:16px; height:16px; flex-shrink:0;}
.radio-opt.checked{background:var(--brand-blue-light); border-color:var(--brand-blue);}

/* ---------- Barre d'actions ---------- */
.actionbar{
  position:sticky; bottom:0; z-index:10;
  background:var(--paper-raised); border-top:1px solid var(--line);
  padding:12px 0; margin-top:32px;
  width:100vw; margin-left:calc(50% - 50vw);
}
.actionbar-inner{
  max-width:980px; margin:0 auto; padding:0 24px;
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
}
.actions{display:flex; flex-wrap:wrap; gap:8px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:8px 16px; border-radius:var(--r-control); cursor:pointer;
  font-weight:500; font-size:13px;
  border:1px solid var(--brand-blue); background:var(--brand-blue); color:#ffffff;
  transition:background-color var(--fast) var(--ease), border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.btn:hover{background:var(--brand-blue-dark); border-color:var(--brand-blue-dark);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{background:transparent; border-color:var(--brand-blue); color:var(--brand-blue-dark);}
.status-msg{font-size:12px; color:var(--ink-muted);}

/* ---------- Bilans enregistrés ---------- */
.archive-note{font-size:13px; color:var(--ink-muted); margin:0 0 8px; line-height:1.6;}
.saved-list{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
.saved-item{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 16px; border:1px solid var(--line); border-radius:var(--r-control);
  background:var(--paper-raised); cursor:pointer; font-size:13px;
  transition:border-color var(--fast) var(--ease);
}
.saved-item:hover{border-color:var(--brand-blue);}
.saved-item strong{font-weight:500;}
.saved-item .meta{color:var(--ink-muted); font-size:12px;}
.saved-actions{display:flex; gap:16px; align-items:center; color:var(--ink-muted);}
.saved-actions [data-del]{color:var(--coral); cursor:pointer; display:inline-flex;}

.print-only{display:none;}

@media (max-width:680px){
  .app{padding:0 16px 24px;}
  .plate{margin-top:16px; padding:24px;}
  .plate-sub{font-size:13px;}
  .identity{grid-template-columns:1fr 1fr; padding:16px; gap:16px;}
  .field input{font-size:16px;}
  .modebar{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));}
  .synth-grid, .strengths{grid-template-columns:minmax(0, 1fr);}
  .synth-card, .decision-box{padding:16px;}
  .axe-head{flex-wrap:wrap; gap:12px; padding:16px;}
  .axe-meta{flex:1 1 calc(100% - 48px);}
  .axe-head .vu-toggle{margin-left:48px;}
  .axe-desc{padding-left:16px; padding-right:16px;}
  .axe-body{padding-left:16px; padding-right:16px;}
  .gauge{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));}
  .gauge button{min-height:44px;}
  .rank-item{flex-wrap:wrap; gap:8px 12px; padding:16px;}
  .rank-main{flex-basis:calc(100% - 36px);}
  .rank-pistelabel{width:auto; margin-left:36px; text-align:left;}
  .actionbar-inner{padding:0 16px; gap:8px;}
  .actions{display:grid; grid-template-columns:1fr 1fr; width:100%;}
  #btn-print{grid-column:1 / -1; grid-row:2;}
  .btn{padding:8px 12px;}
}

@media print{
  .modebar, .actionbar, .saved-panel, .no-print{display:none !important;}
  .section{display:block !important;}
  .print-only{display:block;}
  body{background:white; font-size:11px;}
  .app{max-width:none; padding:0;}
  .plate{margin:0 0 16px; padding:16px 24px; background:white; color:var(--ink); border:1px solid var(--line);}
  .plate-eyebrow{color:var(--brand-blue);}
  .plate-sub{color:var(--ink-soft);}
  .plate-title{font-size:24px;}
  .axe-card, .synth-card, .decision-box, .rank-item{break-inside:avoid;}
  .synth-grid{grid-template-columns:1fr;}
  .axe-head, .gauge button, .bar-fill{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>

      "Simuler un montage / câblage sur ordinateur et le tester",
      "Passer du montage virtuel au montage réel",
      "Repérer une panne, comprendre pourquoi, et améliorer le système"
    ]
  }

  { value: 1, label: "Pas du tout intéressé", short: "Pas intéressé", color: "s1" },
  { value: 2, label: "Curieux, mais encore flou pour moi", short: "Curieux", color: "s2" },
  { value: 3, label: "Intéressé, et je comprends", short: "Intéressé", color: "s3" },
  { value: 4, label: "Très intéressé, ça me parle vraiment", short: "Ça me parle", color: "s4" }
];

// ============================================================
// VOLET SAVOIR-ÊTRE — auto-positionnement (posture / comportement)
// Dérivé des savoir-faire comportementaux (SFC) Construform par métier.
// Échelle : à quel point le/la stagiaire se reconnaît dans l'affirmation.
// ============================================================

  {

    label: "Soin & minutie",

  },

    item: "Quand quelque chose est difficile, je m'accroche jusqu'au bout."

let state = {
  meta: { nom: "", prenom: "", date: new Date().toISOString().slice(0,10), formateur: "" },
  scores: {},       // { axeId: { itemIndex: niveau } }
  se_scores: {},    // { seId: niveau } — volet savoir-être
  notVu: {},        // { axeId: true } — axes non abordés avec ce groupe
  notes: {},        // { axeId: "texte libre" }
  decision: { type: "", commentaire: "" },
  mode: "evaluation"
};

let savedKey = null;

// ============================================================
// UTILITAIRES
// ============================================================
function niveauInfo(v){ return NIVEAUX.find(n => n.value === v) || NIVEAUX[0]; }

function pisteLabel(rank){
  if (rank <= 2) return "Piste forte";
  if (rank <= 5) return "À explorer";
  return "Piste secondaire";
}
function pisteColor(rank){
  if (rank <= 2) return "blue";
  if (rank <= 5) return "slate";
  return "gray";
}
function interetLabel(sc){
  if (sc.answeredCount === 0) return "—";
  if (sc.pct >= 70) return "Fort intérêt";
  if (sc.pct >= 35) return "Intérêt moyen";
  return "Peu d'intérêt";
}

function colorHex(name){
  const map = {
    gray:"#626c7a", low:"#9aa1ad", purple:"#8c4292", blue:"#5b60a8", slate:"#465260",
    s1:"#b4bac6", s2:"#a7abd8", s3:"#5b60a8", s4:"#8c4292"
  };
  return map[name] || "#626c7a";
}

function axeScore(axeId){
  const axe = AXES.find(a => a.id === axeId);
  const sc = state.scores[axeId] || {};
  const answered = axe.items.map((_, i) => sc[i]).filter(v => v !== undefined);
  const sum = answered.reduce((a,b)=>a+b,0);
  const max = answered.length * 4;
  const min = answered.length * 1;
  // normalise sur l'échelle réelle 1-4 (et non 0-4) pour que "pas du tout intéressé" = 0%
  const pct = answered.length ? Math.round(((sum - min) / (max - min || 1)) * 100) : 0;
  return { sum, max, pct, vals: axe.items.map((_, i) => sc[i]), answeredCount: answered.length };
}

function allAxesScores(){
  const out = {};
  AXES.forEach(a => out[a.id] = axeScore(a.id));
  return out;
}

function axeVu(axeId){
  return !state.notVu || !state.notVu[axeId];
}

function globalProgress(){
  let total = 0, filled = 0;
  AXES.forEach(a => {
    if (!axeVu(a.id)) return;
    a.items.forEach((_, i) => {
      total++;
      const v = state.scores[a.id]?.[i];
      if (v !== undefined) filled++;
    });
  });
  SAVOIR_ETRE.forEach(se => {
    total++;
    if (state.se_scores[se.id] !== undefined) filled++;
  });
  return { total, filled, pct: total ? Math.round((filled/total)*100) : 0 };
}

// Score savoir-être normalisé 0-1 par dimension (échelle 1-4)
function seRatio(seId){
  const v = state.se_scores[seId];
  if (v === undefined) return null;
  return (v - 1) / 3;
}

// ============================================================
// MATCHING MÉTIERS / FORMATIONS
// ============================================================
function computeFormationMatches(){
  const scores = allAxesScores();
  const ratio = {};
  AXES.forEach(a => ratio[a.id] = scores[a.id].max ? (scores[a.id].sum - scores[a.id].answeredCount) / ((scores[a.id].max - scores[a.id].answeredCount) || 1) : 0);

  const seRenseigne = SAVOIR_ETRE.some(se => state.se_scores[se.id] !== undefined);

  return FORMATIONS.map(f => {
    // composante intérêt : moyenne des axes liés à la formation,
    // en ignorant les axes non abordés avec ce groupe (ni bonus ni malus)
    const axesVus = f.lien_axes.filter(id => axeVu(id));
    const axesVals = axesVus.map(id => ratio[id] || 0);
    const interetScore = axesVals.length ? axesVals.reduce((a,b)=>a+b,0)/axesVals.length : 0;

    // composante savoir-être : proximité entre le profil du stagiaire
    // et le savoir-être attendu du métier visé par la formation
    let seScore = null;
    if (seRenseigne && f.se_profile){
      let acc = 0, n = 0;
      Object.entries(f.se_profile).forEach(([seId, attendu]) => {
        const r = seRatio(seId);
        if (r !== null){
          const attenduRatio = (attendu - 1) / 3;
          acc += Math.max(0, 1 - Math.abs(r - attenduRatio));
          n++;
        }
      });
      if (n > 0) seScore = acc / n;
    }

    const combined = (seScore !== null)
      ? interetScore * 0.7 + seScore * 0.3
      : interetScore;
    return { ...f, pertinence: Math.round(combined * 100) };
  }).sort((a,b) => b.pertinence - a.pertinence);
}

    <div class="identity no-print">
      <div class="field">
        <label for="meta-prenom">Prénom</label>
        <input type="text" id="meta-prenom" value="${escapeAttr(state.meta.prenom)}">
      </div>
      <div class="field">
        <label for="meta-nom">Nom</label>
        <input type="text" id="meta-nom" value="${escapeAttr(state.meta.nom)}">
      </div>
      <div class="field">
        <label for="meta-date">Date du bilan</label>
        <input type="date" id="meta-date" value="${escapeAttr(state.meta.date)}">
      </div>
      <div class="field">
        <label for="meta-formateur">Formateur·rice</label>
        <input type="text" id="meta-formateur" value="${escapeAttr(state.meta.formateur)}" placeholder="Ton nom">
      </div>
    </div>

    <div class="progress no-print">
      <div class="progress-strip" id="progress-strip"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div class="modebar no-print">
      <button data-mode="evaluation">1 · Échange guidé</button>
      <button data-mode="synthese">2 · Synthèse</button>
      <button data-mode="orientation">3 · Pistes</button>
      <button data-mode="archives">Bilans enregistrés</button>
    </div>

    <div class="section" id="section-evaluation"></div>
    <div class="section" id="section-synthese"></div>
    <div class="section" id="section-orientation"></div>
    <div class="section" id="section-archives"></div>

    <div class="actionbar no-print">
      <div class="actionbar-inner">
        <span class="status-msg" id="status-msg">Bilan non enregistré</span>
        <div class="actions">
          <button class="btn secondary" id="btn-save">${icon('save')} Enregistrer le brouillon</button>
          <button class="btn secondary" id="btn-print">${icon('download')} Imprimer ou PDF</button>
          <button class="btn" id="btn-new">${icon('plus')} Nouveau bilan</button>
        </div>
      </div>
    </div>
  `;

  ['meta-prenom','meta-nom','meta-date','meta-formateur'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const key = id.replace('meta-','');
      state.meta[key] = e.target.value;
    });
  });

  document.querySelectorAll('.modebar button').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  document.getElementById('btn-save').addEventListener('click', saveCurrentBilan);
  document.getElementById('btn-print').addEventListener('click', () => { renderPrintView(); setTimeout(()=>window.print(), 50); });
  document.getElementById('btn-new').addEventListener('click', startNewBilan);

  switchMode(state.mode);
}

function escapeAttr(s){ return String(s||"").replace(/"/g,'&quot;'); }

function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll('.modebar button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if (mode === 'evaluation'){ renderEvaluation(); document.getElementById('section-evaluation').classList.add('active'); }
  if (mode === 'synthese'){ renderSynthese(); document.getElementById('section-synthese').classList.add('active'); }
  if (mode === 'orientation'){ renderOrientation(); document.getElementById('section-orientation').classList.add('active'); }
  if (mode === 'archives'){ renderArchives(); document.getElementById('section-archives').classList.add('active'); }
  updateProgress();
}

function updateProgress(){
  const p = globalProgress();
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  if (fill) fill.style.width = p.pct + '%';
  const strip = document.getElementById('progress-strip');
  if (strip && p.total) strip.style.setProperty('--step', (100 / p.total) + '%');
  if (label) label.textContent = `${p.filled} / ${p.total} points abordés ensemble`;
}

// RENDU — MODE ÉVALUATION
// ============================================================
function renderEvaluation(){
  const el = document.getElementById('section-evaluation');
  el.innerHTML = `
    <div class="section-intro">
      <div class="section-intro-title">Ce qui t'a intéressé pendant l'atelier</div>
      <div class="section-intro-sub">Pour chaque activité, dis à quel point ça t'a parlé. Il n'y a pas de bonne réponse.</div>
    </div>
    <div class="legend">
      ${NIVEAUX.map(n => `<span><i style="background:${colorHex(n.color)}"></i>${n.label}</span>`).join('')}
    </div>
    ${AXES.map(axe => renderAxeCard(axe)).join('')}

    <div class="section-intro">
      <div class="section-intro-title">Comment tu te vois au travail</div>
      <div class="section-intro-sub">Ces façons d'être comptent autant que les techniques. Situe-toi honnêtement.</div>
    </div>
    <div class="legend">
      ${NIVEAUX_SE.map(n => `<span><i style="background:${colorHex(n.color)}"></i>${n.label}</span>`).join('')}
    </div>
    <div class="axe-card">
      <div class="axe-body">
        ${SAVOIR_ETRE.map(se => {

          return `

        }).join('')}

  AXES.forEach(axe => {
    axe.items.forEach((_, i) => {
      el.querySelectorAll(`.gauge[data-axe="${axe.id}"][data-item="${i}"] button`).forEach(btn => {
        btn.addEventListener('click', () => {

          state.scores[axe.id] = state.scores[axe.id] || {};
          state.scores[axe.id][i] = v;
          renderEvaluation();
          updateProgress();
        });
      });
    });
    const noteArea = el.querySelector(`textarea[data-note-axe="${axe.id}"]`);
    if (noteArea){
      noteArea.value = state.notes[axe.id] || "";
      noteArea.addEventListener('input', e => { state.notes[axe.id] = e.target.value; });
    }
  });

  SAVOIR_ETRE.forEach(se => {
    el.querySelectorAll(`.gauge[data-se="${se.id}"] button`).forEach(btn => {
      btn.addEventListener('click', () => {
        state.se_scores[se.id] = parseInt(btn.dataset.val);
        renderEvaluation();
        updateProgress();
      });
    });
  });

  el.querySelectorAll('input[data-vu]').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.vu;
      if (!state.notVu) state.notVu = {};
      if (e.target.checked) delete state.notVu[id];
      else state.notVu[id] = true;
      renderEvaluation();
      updateProgress();
    });
  });
}

function renderAxeCard(axe){
  const vu = !state.notVu || !state.notVu[axe.id];
  return `
    <div class="axe-card ${vu ? '' : 'axe-notvu'}">
      <div class="axe-head">
        <div class="axe-icon">${icon(axe.icon, 20)}</div>
        <div class="axe-meta">
          <div class="axe-label">${axe.label}</div>
        </div>
        <label class="vu-toggle" title="Décoche si ce module n'a pas été abordé avec ce groupe">
          <input type="checkbox" data-vu="${axe.id}" ${vu ? 'checked' : ''}>
          <span>${vu ? 'Abordé' : 'Non abordé'}</span>
        </label>
      </div>
      <div class="axe-desc">${axe.description}</div>
      ${vu ? `
      <div class="axe-body">
        ${axe.items.map((item, i) => {
          const cur = state.scores[axe.id]?.[i];
          return `
          <div class="item-row">
            <div class="item-text">${item}</div>
            <div class="gauge" data-axe="${axe.id}" data-item="${i}">
              ${NIVEAUX.map(n => `<button data-val="${n.value}" class="${cur === n.value ? 'sel-'+n.value : ''}" title="${n.label}">${n.short}</button>`).join('')}

          <textarea data-note-axe="${axe.id}" placeholder="Ex : j'ai adoré manipuler la découpeuse laser...">${state.notes[axe.id] || ''}</textarea>
        </div>
      </div>` : `<div class="axe-notvu-msg">Module non abordé avec ce groupe, écarté de la synthèse et des pistes</div>`}

  `;
}

function renderSynthese(){

  el.innerHTML = `
    <div class="synth-grid">
      <div class="synth-card">
        <h3>Profil d'intérêt</h3>
        ${AXES.filter(a => axeVu(a.id)).map(a => {
          const sc = scores[a.id];

          return `
          <div class="bar-row">
            <div class="bar-label">${a.label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${sc.pct}%; background:${colorHex(color)}"></div></div>
            <div class="bar-word" style="color:${colorHex(color)};">${interetLabel(sc)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="synth-card">
        <h3>Vue d'ensemble</h3>
        <div class="radar-wrap" id="radar-holder"></div>
      </div>
    </div>

    <div class="synth-card">
      <h3>Comment tu te vois au travail</h3>
      ${SAVOIR_ETRE.map(se => {
        const v = state.se_scores[se.id];
        const r = v === undefined ? null : (v-1)/3;
        const color = r === null ? 'gray' : r >= 0.99 ? 'purple' : r >= 0.33 ? 'blue' : 'low';
        const word = v === undefined ? '—' : (NIVEAUX_SE.find(n=>n.value===v)||{}).short;
        return `
        <div class="bar-row">
          <div class="bar-label">${se.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${r===null?0:Math.round(r*100)}%; background:${colorHex(color)}"></div></div>
          <div class="bar-word" style="color:${colorHex(color)};">${word}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="synth-card">
      <h3>Points forts &amp; points de vigilance</h3>
      <div id="strengths-holder"></div>
    </div>
  `;

  renderRadar(scores);
  renderStrengths(scores);
}

const AXIS_SHORT_LABELS = {
  lecture_plan: "Lecture de plan",
  conception_numerique: "Conception num.",
  contraintes_fabrication: "Contraintes fab.",
  pilotage_machines: "Pilotage machines",
  communication_argumentation: "Communication",
  autonomie_projet: "Autonomie",
  electronique: "Électronique"
};

function renderRadar(scores){
  const holder = document.getElementById('radar-holder');
  const vusAxes = AXES.filter(a => axeVu(a.id));
  if (vusAxes.length < 3){
    holder.innerHTML = `<div class="empty-note" style="text-align:center; padding:40px 12px;">Le radar s'affiche à partir de 3 modules abordés.</div>`;
    return;
  }
  const drawSize = 280, margin = 96;
  const size = drawSize + margin*2;
  const cx = size/2, cy = size/2, r = drawSize/2 - 10;
  const n = vusAxes.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;

  const points = vusAxes.map((a,i) => {
    const pct = scores[a.id].pct / 100;
    const x = cx + Math.cos(angle(i)) * r * pct;
    const y = cy + Math.sin(angle(i)) * r * pct;
    return `${x},${y}`;
  }).join(' ');

  const gridLevels = [0.25, 0.5, 0.75, 1];
  const gridPolys = gridLevels.map(lv => {
    const pts = vusAxes.map((_, i) => {
      const x = cx + Math.cos(angle(i)) * r * lv;
      const y = cy + Math.sin(angle(i)) * r * lv;
      return `${x},${y}`;
    }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#dce0e9" stroke-width="1"/>`;
  }).join('');

  const axisLines = vusAxes.map((_, i) => {
    const x = cx + Math.cos(angle(i)) * r;
    const y = cy + Math.sin(angle(i)) * r;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dce0e9" stroke-width="1"/>`;
  }).join('');

  const labels = vusAxes.map((a, i) => {
    const lx = cx + Math.cos(angle(i)) * (r+28);
    const ly = cy + Math.sin(angle(i)) * (r+28);
    const anchor = Math.cos(angle(i)) > 0.3 ? 'start' : Math.cos(angle(i)) < -0.3 ? 'end' : 'middle';
    const short = AXIS_SHORT_LABELS[a.id] || a.label;
    return `<text x="${lx}" y="${ly}" font-size="11" font-family="Poppins, sans-serif" fill="#465260" text-anchor="${anchor}" dominant-baseline="middle">${short}</text>`;
  }).join('');

  holder.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${gridPolys}
      ${axisLines}
      <polygon points="${points}" fill="#5b60a833" stroke="#5b60a8" stroke-width="2"/>
      ${labels}
    </svg>
  `;
}

function renderStrengths(scores){
  const holder = document.getElementById('strengths-holder');
  const answered = AXES.filter(a => axeVu(a.id)).map(a => ({ axe:a, sc: scores[a.id] })).filter(r => r.sc.answeredCount > 0);
  const ranked = answered.sort((x,y) => y.sc.pct - x.sc.pct);
  const strong = ranked.filter(r => r.sc.pct >= 60).slice(0,3);
  const weak = ranked.filter(r => r.sc.pct < 40).slice(-3).reverse();

  holder.innerHTML = `
    <div class="strengths">
      <div>
        <h4 class="subsection-heading">Ce qui l'attire le plus</h4>
        ${strong.length ? strong.map(s => `<div class="strength-row">${s.axe.label}</div>`).join('') : '<div class="empty-note">À discuter ensemble, rien de nettement marqué pour l&#39;instant</div>'}
      </div>
      <div>
        <h4 class="subsection-heading">Ce qui l'attire moins</h4>
        ${weak.length ? weak.map(s => `<div class="strength-row">${s.axe.label}</div>`).join('') : '<div class="empty-note">Intérêt assez homogène sur les différents axes</div>'}
      </div>
    </div>
  `;
}

// RENDU — MODE ORIENTATION
// ============================================================

// ============================================================
// PERSISTENCE — localStorage (fonctionne en fichier local, hors-ligne)
// ============================================================
function bilanKeyFromMeta(){
  const safe = s => (s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return `bilan_${safe(state.meta.nom)}-${safe(state.meta.prenom)}_${state.meta.date}`;
}

function saveCurrentBilan(){
  const statusEl = document.getElementById('status-msg');
  if (!state.meta.nom && !state.meta.prenom){
    statusEl.textContent = "Indique au moins un nom avant d'enregistrer.";
    return;
  }
  savedKey = bilanKeyFromMeta();
  try {
    localStorage.setItem(savedKey, JSON.stringify(state));
    touchIndex(savedKey);
    statusEl.textContent = `Enregistré sur cet ordinateur · ${state.meta.prenom} ${state.meta.nom} (${state.meta.date})`;
  } catch(e){
    statusEl.textContent = "Échec de l'enregistrement (stockage local indisponible).";
    console.error(e);
  }
}

function touchIndex(key){
  try {
    let idx = [];
    const raw = localStorage.getItem('bilans_index');
    if (raw) idx = JSON.parse(raw);
    if (!idx.includes(key)) idx.push(key);
    localStorage.setItem('bilans_index', JSON.stringify(idx));
  } catch(e){ console.error(e); }
}

function loadIndex(){
  try {
    const raw = localStorage.getItem('bilans_index');
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function renderArchives(){
  const el = document.getElementById('section-archives');
  const idx = loadIndex();

  if (!idx.length){
    el.innerHTML = `
    <p class="archive-note">Aucun bilan enregistré pour l'instant sur cet ordinateur. Utilise « Enregistrer le brouillon » en bas de page une fois un bilan complété.</p>
    <p class="archive-note">« Enregistrer le brouillon » garde le bilan sur ce navigateur et cet appareil uniquement. Pour conserver ou transmettre un bilan, utilise « Imprimer ou PDF » et choisis « Enregistrer au format PDF » comme destination.</p>`;
      return;
  }
  const items = [];
  idx.forEach(key => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) items.push({ key, data: JSON.parse(raw) });
    } catch(e){}
  });
  items.sort((a,b) => (b.data.meta.date||'').localeCompare(a.data.meta.date||''));

  el.innerHTML = `
    <p class="archive-note">Bilans enregistrés sur cet ordinateur et ce navigateur</p>
    <div class="saved-list">
      ${items.map(it => `
        <div class="saved-item" data-key="${it.key}">
          <div>
            <strong>${it.data.meta.prenom || ''} ${it.data.meta.nom || '(sans nom)'}</strong>
            <span class="meta"> · ${it.data.meta.date || ''} ${it.data.meta.formateur ? '· formateur·rice : '+it.data.meta.formateur : ''}</span>
          </div>
          <div class="saved-actions">
            <i class="ti ti-trash" data-del="${it.key}" title="Supprimer">${icon('trash')}</i>
            <i class="ti ti-chevron-right" style="display:inline-flex;">${icon('chevron')}</i>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  el.querySelectorAll('.saved-item').forEach(div => {
    div.addEventListener('click', (e) => {
      const delTarget = e.target.closest('[data-del]');
      if (delTarget){
        e.stopPropagation();
        if (confirm("Supprimer définitivement ce bilan enregistré ?")){
          localStorage.removeItem(delTarget.dataset.del);
          const idx2 = loadIndex().filter(k => k !== delTarget.dataset.del);
          localStorage.setItem('bilans_index', JSON.stringify(idx2));
          renderArchives();
        }
        return;
      }
      const key = div.dataset.key;
      const raw = localStorage.getItem(key);
      if (raw){
        state = JSON.parse(raw);
        if (!state.se_scores) state.se_scores = {};
        if (!state.notVu) state.notVu = {};
        savedKey = key;
        renderShell();
      }
    });
  });
}

function startNewBilan(){
  if (!confirm("Démarrer un nouveau bilan vierge ? Le bilan actuel non enregistré sera perdu.")) return;
  state = {
    meta: { nom:"", prenom:"", date: new Date().toISOString().slice(0,10), formateur: state.meta.formateur || "" },
    scores: {}, se_scores: {}, notVu: {}, notes: {}, decision: { type:"", commentaire:"" }, mode: "evaluation"
  };
  savedKey = null;
  renderShell();
}

// ============================================================
// VUE IMPRESSION (toutes les sections visibles + en-tête imprimable)
// ============================================================
function renderPrintView(){
  ['evaluation','synthese','orientation'].forEach(m => {
    if (m === 'evaluation') renderEvaluation();
    if (m === 'synthese') renderSynthese();
    if (m === 'orientation') renderOrientation();
    document.getElementById('section-'+m).classList.add('active');
  });
}

// ============================================================
// INIT
// ============================================================
renderShell();
