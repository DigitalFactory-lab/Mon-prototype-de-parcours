<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photographie des intérêts — Opération Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2933;
  --ink-soft:#3B4754;
  --paper:#FAF7F2;
  --paper-raised:#FFFFFF;
  --line:#DCD5C7;
  --copper:#C2643B;
  --copper-dark:#8A4527;
  --copper-light:#F2DDD2;
  --teal:#2F6F62;
  --teal-light:#DCEAE5;
  --amber:#B9852A;
  --amber-light:#F3E6CC;
  --coral:#B14B3C;
  --coral-light:#F3DAD3;
  --gray-mid:#8A8377;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Source Sans 3', sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  padding-bottom:80px;
}
.app{max-width:980px;margin:0 auto;padding:0 24px;}

/* ---------- HEADER : plaque d'atelier ---------- */
.plate{
  background:var(--ink);
  color:var(--paper);
  padding:28px 32px;
  margin:24px 0 8px;
  border-radius:4px;
  position:relative;
  overflow:hidden;
}
.plate::before{
  content:"";
  position:absolute; top:0; left:0; bottom:0; width:8px;
  background:var(--copper);
}
.plate-eyebrow{
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--copper-light); font-weight:600; margin-bottom:6px;
}
.plate-title{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:26px;
  letter-spacing:0.02em; text-transform:uppercase;
}
.plate-sub{font-size:14px; color:#C9CFD4; margin-top:6px;}

/* ---------- IDENTITY BAR ---------- */
.identity{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:4px;
  margin-top:16px;
  padding:18px 24px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
}
.field label{
  display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--gray-mid); font-weight:600; margin-bottom:4px;
}
.field input, .field select{
  width:100%; border:none; border-bottom:2px solid var(--line);
  background:transparent; font-size:15px; padding:4px 2px;
  font-family:inherit; color:var(--ink);
}
.field input:focus, .field select:focus{outline:none; border-bottom-color:var(--copper);}

/* ---------- NAV TABS (mode) ---------- */
.modebar{
  display:flex; gap:8px; margin:20px 0 4px;
}
.modebar button{
  flex:1; padding:12px 14px; border:1px solid var(--line); background:var(--paper-raised);
  font-family:'Oswald', sans-serif; font-weight:500; font-size:13px; letter-spacing:0.03em;
  text-transform:uppercase; color:var(--ink-soft); border-radius:4px; cursor:pointer;
  transition:all .15s;
}
.modebar button.active{
  background:var(--ink); color:var(--paper); border-color:var(--ink);
}
.modebar button:not(.active):hover{border-color:var(--copper); color:var(--copper-dark);}

.section{display:none;}
.section.active{display:block;}

/* ---------- AXE CARD (fiche d'habilitation) ---------- */
.axe-card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:6px;
  margin:18px 0;
  overflow:hidden;
}
.axe-head{
  display:flex; align-items:center; gap:14px;
  padding:16px 20px;
  background:linear-gradient(to right, var(--ink) 0%, var(--ink) 4px, transparent 4px);
  border-bottom:1px solid var(--line);
}
.axe-icon{
  width:38px; height:38px; border-radius:50%;
  background:var(--copper-light); color:var(--copper-dark);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.axe-meta{flex:1;}
.axe-jour{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gray-mid); font-weight:600;}
.axe-label{font-family:'Oswald', sans-serif; font-weight:600; font-size:16px; margin-top:1px;}
.axe-desc{font-size:13px; color:var(--ink-soft); padding:12px 20px 0; line-height:1.5;}

.axe-body{padding:14px 20px 18px;}
.item-row{
  display:flex; flex-direction:column; gap:8px;
  padding:12px 0; border-top:1px solid #EFEAE0;
}
.item-row:first-child{border-top:none;}
.item-text{font-size:14px; color:var(--ink); flex:1;}

.gauge{
  display:flex; gap:4px;
}
.gauge button{
  flex:1; padding:7px 4px; border:1px solid var(--line); background:var(--paper);
  font-size:11px; font-weight:600; color:var(--gray-mid); cursor:pointer;
  border-radius:3px; transition:all .12s; text-align:center;
}
.gauge button.sel-0{background:#EDEAE3; color:var(--gray-mid); border-color:var(--gray-mid);}
.gauge button.sel-1{background:var(--coral-light); color:var(--coral); border-color:var(--coral);}
.gauge button.sel-2{background:var(--amber-light); color:var(--amber); border-color:var(--amber);}
.gauge button.sel-3{background:var(--teal-light); color:var(--teal); border-color:var(--teal);}
.gauge button.sel-4{background:#E3DCF0; color:#5C4A8A; border-color:#5C4A8A;}

.axe-note{
  margin-top:12px;
}
.axe-note textarea{
  width:100%; border:1px solid var(--line); border-radius:4px;
  padding:8px 10px; font-family:inherit; font-size:13px; resize:vertical; min-height:44px;
  background:#FFFDF9;
}
.axe-note textarea:focus{outline:none; border-color:var(--copper);}
.axe-note-label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--gray-mid); font-weight:600; margin-bottom:4px; display:block;}

.axe-score-dot{
  width:12px; height:12px; border-radius:50%; flex-shrink:0;
}

/* ---------- LEGEND ---------- */
.section-intro{margin:8px 0 4px;}
.section-intro-title{font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; color:var(--ink); text-transform:uppercase; letter-spacing:0.02em;}
.section-intro-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.legend{
  display:flex; flex-wrap:wrap; gap:10px; margin:16px 0;
  font-size:12px; color:var(--ink-soft);
}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}

/* ---------- SYNTHESIS ---------- */
.synth-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;
}
.synth-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:18px;
}
.synth-card h3{
  font-family:'Oswald', sans-serif; font-size:14px; text-transform:uppercase;
  letter-spacing:0.04em; margin-bottom:14px; color:var(--ink-soft);
}
.bar-row{display:flex; align-items:center; gap:10px; margin:9px 0;}
.bar-label{font-size:12px; width:160px; flex-shrink:0; color:var(--ink);}
.bar-track{flex:1; height:14px; background:#EFEAE0; border-radius:3px; overflow:hidden;}
.bar-fill{height:100%; border-radius:3px;}
.bar-word{font-size:11px; font-weight:600; width:92px; text-align:right; flex-shrink:0; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}

.radar-wrap{display:flex; justify-content:center; padding:8px 0;}

/* ---------- RANKING (métiers / formations) ---------- */
.rank-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.rank-item{
  display:flex; align-items:center; gap:14px;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
  padding:14px 16px;
}
.rank-pos{
  font-family:'Oswald', sans-serif; font-size:20px; font-weight:700;
  color:var(--copper); width:30px; text-align:center; flex-shrink:0;
}
.rank-main{flex:1;}
.rank-title{font-weight:600; font-size:14px;}
.rank-sub{font-size:12px; color:var(--gray-mid); margin-top:2px;}
.rank-note{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}
.rank-tag{
  font-size:10px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600;
  padding:3px 8px; border-radius:10px; white-space:nowrap; flex-shrink:0;
}
.tag-penurie{background:var(--teal-light); color:var(--teal);}
.rank-pistelabel{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:12px;
  text-transform:uppercase; letter-spacing:0.04em;
  width:110px; text-align:right; flex-shrink:0;
}

/* ---------- DECISION BOX (suite de parcours) ---------- */
.decision-box{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:6px;
  padding:20px; margin:18px 0;
}
.decision-box h3{
  font-family:'Oswald', sans-serif; font-size:14px; text-transform:uppercase;
  letter-spacing:0.04em; margin-bottom:12px; color:var(--ink-soft);
}
.radio-row{display:flex; flex-direction:column; gap:8px;}
.radio-opt{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; cursor:pointer; font-size:14px;
  transition:all .12s;
}
.radio-opt:hover{border-color:var(--copper);}
.radio-opt input{accent-color:var(--copper);}
.radio-opt.checked{background:var(--copper-light); border-color:var(--copper);}

textarea.free{
  width:100%; border:1px solid var(--line); border-radius:4px; padding:10px;
  font-family:inherit; font-size:14px; min-height:90px; resize:vertical; margin-top:10px;
  background:#FFFDF9;
}
textarea.free:focus{outline:none; border-color:var(--copper);}

/* ---------- FOOTER ACTIONS ---------- */
.actionbar{
  position:sticky; bottom:0; left:0; right:0;
  background:var(--paper-raised); border-top:1px solid var(--line);
  padding:14px 0; margin-top:30px;
}
.actionbar-inner{
  max-width:980px; margin:0 auto; padding:0 24px;
  display:flex; gap:10px; align-items:center; justify-content:space-between;
}
.btn{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; letter-spacing:0.03em;
  text-transform:uppercase; padding:11px 18px; border-radius:4px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  display:inline-flex; align-items:center; gap:6px; transition:opacity .15s;
}
.btn:hover{opacity:0.85;}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{border-color:var(--copper); color:var(--copper-dark); opacity:1;}
.status-msg{font-size:12px; color:var(--gray-mid);}

/* ---------- SAVED LIST ---------- */
.saved-list{margin-top:10px;}
.saved-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border:1px solid var(--line); border-radius:4px; margin-bottom:6px;
  background:var(--paper-raised); cursor:pointer; font-size:13px;
}
.saved-item:hover{border-color:var(--copper);}
.saved-item .meta{color:var(--gray-mid); font-size:11px;}

.progress-strip{
  height:5px; background:#EFEAE0; border-radius:3px; margin:14px 0 4px; overflow:hidden;
}
.progress-fill{height:100%; background:var(--copper); transition:width .2s;}
.progress-label{font-size:11px; color:var(--gray-mid); text-align:right;}

.print-only{display:none;}

@media print{
  .modebar, .actionbar, .saved-panel, .no-print{display:none !important;}
  .section{display:block !important;}
  body{background:white;}
  .print-only{display:block;}
}

@media (max-width:680px){
  .identity{grid-template-columns:1fr 1fr;}
  .synth-grid{grid-template-columns:1fr;}
  .modebar{flex-wrap:wrap;}
}
</style>
</head>

function icon(name, size){
  return `<span style="display:inline-flex; width:${size||16}px; height:${size||16}px; vertical-align:-3px;">${ICONS[name]||''}</span>`;
}


let state = {
  meta: { nom: "", prenom: "", date: new Date().toISOString().slice(0,10), formateur: "" },
  scores: {},       // { axeId: { itemIndex: niveau } }
  se_scores: {},    // { seId: niveau } — volet savoir-être
  notes: {},        // { axeId: "texte libre" }
  decision: { type: "", commentaire: "" },
  mode: "evaluation"
};

let savedKey = null;

// ============================================================
// UTILITAIRES
// ============================================================
function niveauInfo(v){ return NIVEAUX.find(n => n.value === v) || NIVEAUX[0]; }

function pisteLabel(rank){
  if (rank <= 2) return "Piste forte";
  if (rank <= 5) return "À explorer";
  return "Piste secondaire";
}
function pisteColor(rank){
  if (rank <= 2) return "teal";
  if (rank <= 5) return "amber";
  return "gray";
}
function interetLabel(sc){
  if (sc.answeredCount === 0) return "—";
  if (sc.pct >= 70) return "Fort intérêt";
  if (sc.pct >= 35) return "Intérêt moyen";
  return "Peu d'intérêt";
}

function colorHex(name){
  const map = {
    gray:"#8A8377", coral:"#B14B3C", amber:"#B9852A", teal:"#2F6F62", purple:"#5C4A8A"
  };
  return map[name] || "#8A8377";
}

function axeScore(axeId){
  const axe = AXES.find(a => a.id === axeId);
  const sc = state.scores[axeId] || {};
  const answered = axe.items.map((_, i) => sc[i]).filter(v => v !== undefined);
  const sum = answered.reduce((a,b)=>a+b,0);
  const max = answered.length * 4;
  const min = answered.length * 1;
  // normalise sur l'échelle réelle 1-4 (et non 0-4) pour que "pas du tout intéressé" = 0%
  const pct = answered.length ? Math.round(((sum - min) / (max - min || 1)) * 100) : 0;
  return { sum, max, pct, vals: axe.items.map((_, i) => sc[i]), answeredCount: answered.length };
}

function allAxesScores(){
  const out = {};
  AXES.forEach(a => out[a.id] = axeScore(a.id));
  return out;
}

function globalProgress(){
  let total = 0, filled = 0;
  AXES.forEach(a => {
    a.items.forEach((_, i) => {
      total++;
      const v = state.scores[a.id]?.[i];
      if (v !== undefined) filled++;
    });
  });
  SAVOIR_ETRE.forEach(se => {
    total++;
    if (state.se_scores[se.id] !== undefined) filled++;
  });
  return { total, filled, pct: total ? Math.round((filled/total)*100) : 0 };
}

// Score savoir-être normalisé 0-1 par dimension (échelle 1-4)
function seRatio(seId){
  const v = state.se_scores[seId];
  if (v === undefined) return null;
  return (v - 1) / 3;
}

// ============================================================
// MATCHING MÉTIERS / FORMATIONS
// ============================================================
function computeFormationMatches(){
  const scores = allAxesScores();
  const ratio = {};
  AXES.forEach(a => ratio[a.id] = scores[a.id].max ? (scores[a.id].sum - scores[a.id].answeredCount) / ((scores[a.id].max - scores[a.id].answeredCount) || 1) : 0);

  const seRenseigne = SAVOIR_ETRE.some(se => state.se_scores[se.id] !== undefined);

  return FORMATIONS.map(f => {
    // composante intérêt : moyenne des axes liés à la formation
    const axesVals = f.lien_axes.map(id => ratio[id] || 0);
    const interetScore = axesVals.length ? axesVals.reduce((a,b)=>a+b,0)/axesVals.length : 0;

    // composante savoir-être : proximité entre le profil du stagiaire
    // et le savoir-être attendu du métier visé par la formation
    let seScore = null;
    if (seRenseigne && f.se_profile){
      let acc = 0, n = 0;
      Object.entries(f.se_profile).forEach(([seId, attendu]) => {
        const r = seRatio(seId);
        if (r !== null){
          const attenduRatio = (attendu - 1) / 3;
          acc += Math.max(0, 1 - Math.abs(r - attenduRatio));
          n++;
        }
      });
      if (n > 0) seScore = acc / n;
    }

    const combined = (seScore !== null)
      ? interetScore * 0.7 + seScore * 0.3
      : interetScore;
    return { ...f, pertinence: Math.round(combined * 100) };
  }).sort((a,b) => b.pertinence - a.pertinence);
}

function escapeAttr(s){ return String(s||"").replace(/"/g,'&quot;'); }

function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll('.modebar button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  if (mode === 'orientation'){ renderOrientation(); document.getElementById('section-orientation').classList.add('active'); }
  if (mode === 'archives'){ renderArchives(); document.getElementById('section-archives').classList.add('active'); }
  updateProgress();
}

function updateProgress(){
  const p = globalProgress();
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  if (fill) fill.style.width = p.pct + '%';
  if (label) label.textContent = `${p.filled} / ${p.total} points abordés ensemble`;
}

        </div>`;
      }).join('')}
    </div>

    <div class="synth-card" style="margin-top:16px;">
      <h3>Points forts &amp; points de vigilance</h3>
      <div id="strengths-holder"></div>
    </div>
  `;

  renderRadar(scores);
  renderStrengths(scores);
}

const AXIS_SHORT_LABELS = {
  lecture_plan: "Lecture de plan",
  conception_numerique: "Conception num.",
  contraintes_fabrication: "Contraintes fab.",
  pilotage_machines: "Pilotage machines",
  communication_argumentation: "Communication",
  autonomie_projet: "Autonomie"
};

function renderRadar(scores){
  const holder = document.getElementById('radar-holder');
  const drawSize = 280, margin = 70;
  const size = drawSize + margin*2;
  const cx = size/2, cy = size/2, r = drawSize/2 - 10;
  const n = AXES.length;
  const angle = i => (Math.PI*2*i/n) - Math.PI/2;

  const points = AXES.map((a,i) => {
    const pct = scores[a.id].pct / 100;
    const x = cx + Math.cos(angle(i)) * r * pct;
    const y = cy + Math.sin(angle(i)) * r * pct;
    return `${x},${y}`;
  }).join(' ');

  const gridLevels = [0.25, 0.5, 0.75, 1];
  const gridPolys = gridLevels.map(lv => {
    const pts = AXES.map((_, i) => {
      const x = cx + Math.cos(angle(i)) * r * lv;
      const y = cy + Math.sin(angle(i)) * r * lv;
      return `${x},${y}`;
    }).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#DCD5C7" stroke-width="1"/>`;
  }).join('');

  const axisLines = AXES.map((_, i) => {
    const x = cx + Math.cos(angle(i)) * r;
    const y = cy + Math.sin(angle(i)) * r;
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DCD5C7" stroke-width="1"/>`;
  }).join('');

  const labels = AXES.map((a, i) => {
    const lx = cx + Math.cos(angle(i)) * (r+28);
    const ly = cy + Math.sin(angle(i)) * (r+28);
    const anchor = Math.cos(angle(i)) > 0.3 ? 'start' : Math.cos(angle(i)) < -0.3 ? 'end' : 'middle';
    const short = AXIS_SHORT_LABELS[a.id] || a.label;
    return `<text x="${lx}" y="${ly}" font-size="10" fill="#3B4754" text-anchor="${anchor}" dominant-baseline="middle">${short}</text>`;
  }).join('');

  holder.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${gridPolys}
      ${axisLines}
      <polygon points="${points}" fill="#C2643B33" stroke="#C2643B" stroke-width="2"/>
      ${labels}
    </svg>
  `;
}

function renderStrengths(scores){
  const holder = document.getElementById('strengths-holder');
  const answered = AXES.map(a => ({ axe:a, sc: scores[a.id] })).filter(r => r.sc.answeredCount > 0);
  const ranked = answered.sort((x,y) => y.sc.pct - x.sc.pct);
  const strong = ranked.filter(r => r.sc.pct >= 60).slice(0,3);
  const weak = ranked.filter(r => r.sc.pct < 40).slice(-3).reverse();

  holder.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:10px;">
      <div>
        <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--teal); font-weight:600; margin-bottom:8px;">Ce qui l'attire le plus</div>
        ${strong.length ? strong.map(s => `<div style="font-size:13px; padding:6px 0; border-top:1px solid #EFEAE0;">${s.axe.label}</div>`).join('') : '<div style="font-size:13px; color:var(--gray-mid)">À discuter ensemble — rien de nettement marqué pour l&#39;instant.</div>'}
      </div>
      <div>
        <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--coral); font-weight:600; margin-bottom:8px;">Ce qui l'attire moins</div>
        ${weak.length ? weak.map(s => `<div style="font-size:13px; padding:6px 0; border-top:1px solid #EFEAE0;">${s.axe.label}</div>`).join('') : '<div style="font-size:13px; color:var(--gray-mid)">Intérêt assez homogène sur les différents axes.</div>'}
      </div>
    </div>
  `;
}

// ============================================================
// PERSISTENCE — localStorage (fonctionne en fichier local, hors-ligne)
// ============================================================
function bilanKeyFromMeta(){
  const safe = s => (s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return `bilan_${safe(state.meta.nom)}-${safe(state.meta.prenom)}_${state.meta.date}`;
}

function saveCurrentBilan(){
  const statusEl = document.getElementById('status-msg');
  if (!state.meta.nom && !state.meta.prenom){
    statusEl.textContent = "Indique au moins un nom avant d'enregistrer.";
    return;
  }
  savedKey = bilanKeyFromMeta();
  try {
    localStorage.setItem(savedKey, JSON.stringify(state));
    touchIndex(savedKey);
    statusEl.textContent = `Enregistré sur cet ordinateur — ${state.meta.prenom} ${state.meta.nom} (${state.meta.date})`;
  } catch(e){
    statusEl.textContent = "Échec de l'enregistrement (stockage local indisponible).";
    console.error(e);
  }
}

function touchIndex(key){
  try {
    let idx = [];
    const raw = localStorage.getItem('bilans_index');
    if (raw) idx = JSON.parse(raw);
    if (!idx.includes(key)) idx.push(key);
    localStorage.setItem('bilans_index', JSON.stringify(idx));
  } catch(e){ console.error(e); }
}

function loadIndex(){
  try {
    const raw = localStorage.getItem('bilans_index');
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function renderArchives(){
  const el = document.getElementById('section-archives');
  const idx = loadIndex();

  if (!idx.length){
    el.innerHTML = `
    <p style="font-size:13px; color:var(--gray-mid); margin:10px 0;">Aucun bilan enregistré encore sur cet ordinateur. Utilise "Enregistrer" en bas de page une fois un bilan complété.</p>
    <p style="font-size:12px; color:var(--gray-mid); margin-top:8px;">Astuce : "Enregistrer (brouillon)" garde le bilan sur ce navigateur/appareil uniquement. Pour conserver ou transmettre un bilan, utilise "Enregistrer en PDF / Imprimer" et choisis "Enregistrer au format PDF" comme destination.</p>`;
      return;
  }
  const items = [];
  idx.forEach(key => {
    try {
      const raw = localStorage.getItem(key);
      if (raw) items.push({ key, data: JSON.parse(raw) });
    } catch(e){}
  });
  items.sort((a,b) => (b.data.meta.date||'').localeCompare(a.data.meta.date||''));

  el.innerHTML = `
    <p style="font-size:12px; color:var(--gray-mid); margin:10px 0;">Bilans enregistrés sur cet ordinateur / ce navigateur.</p>
    <div class="saved-list">
      ${items.map(it => `
        <div class="saved-item" data-key="${it.key}">
          <div>
            <strong>${it.data.meta.prenom || ''} ${it.data.meta.nom || '(sans nom)'}</strong>
            <span class="meta"> — ${it.data.meta.date || ''} ${it.data.meta.formateur ? '· formateur·rice : '+it.data.meta.formateur : ''}</span>
          </div>
          <div style="display:flex; gap:14px; align-items:center;">
            <i class="ti ti-trash" data-del="${it.key}" style="color:var(--coral); cursor:pointer; display:inline-flex;" title="Supprimer">${icon('trash')}</i>
            <i class="ti ti-chevron-right" style="display:inline-flex;">${icon('chevron')}</i>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  el.querySelectorAll('.saved-item').forEach(div => {
    div.addEventListener('click', (e) => {
      const delTarget = e.target.closest('[data-del]');
      if (delTarget){
        e.stopPropagation();
        if (confirm("Supprimer définitivement ce bilan enregistré ?")){
          localStorage.removeItem(delTarget.dataset.del);
          const idx2 = loadIndex().filter(k => k !== delTarget.dataset.del);
          localStorage.setItem('bilans_index', JSON.stringify(idx2));
          renderArchives();
        }
        return;
      }
      const key = div.dataset.key;
      const raw = localStorage.getItem(key);
      if (raw){
        state = JSON.parse(raw);
        if (!state.se_scores) state.se_scores = {};
        savedKey = key;
        renderShell();
      }
    });
  });
}

function startNewBilan(){
  if (!confirm("Démarrer un nouveau bilan vierge ? Le bilan actuel non enregistré sera perdu.")) return;
  state = {
    meta: { nom:"", prenom:"", date: new Date().toISOString().slice(0,10), formateur: state.meta.formateur || "" },
    scores: {}, se_scores: {}, notes: {}, decision: { type:"", commentaire:"" }, mode: "evaluation"
  };
  savedKey = null;
  renderShell();
}

// ============================================================
// VUE IMPRESSION (toutes les sections visibles + en-tête imprimable)
// ============================================================
function renderPrintView(){
  ['evaluation','synthese','orientation'].forEach(m => {
    if (m === 'evaluation') renderEvaluation();
    if (m === 'synthese') renderSynthese();
    if (m === 'orientation') renderOrientation();
    document.getElementById('section-'+m).classList.add('active');
  });
}

renderShell();
